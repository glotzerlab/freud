name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:

  push:
    branches:
      - "main"
      - "next"

  workflow_dispatch:

permissions: {}

jobs:
  run_tests:
    name: Unit test [py${{ matrix.python }} ${{ matrix.os }}]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        python: ['312', '313', '314']
        include:
          # Test macOS, windows, and ARM Linux on oldest and latest versions.
          - os: 'ubuntu-26.04-arm'
            python: '314'
          - os: 'macos-26'
            python: '314'
          - os: 'windows-2025'
            python: '314'
          - os: 'windows-2025'
            python: '312'
          - os: 'macos-26'
            python: '312'

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Create Python Environment
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.73.0
          cache: false
          environments: py${{ matrix.python }}
          activate-environment: true

      - name: Build and Install freud
        run: |
          uv pip install . --no-build-isolation --no-deps -v --system

      - name: Run Tests
        run: pytest tests/ -v

  tests_complete:
    name: All tests
    if: always()
    needs: [run_tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - run: jq --exit-status 'all(.result == "success")' <<< "${NEEDS}"
      env:
        NEEDS: ${{ toJson(needs) }}
    - run: exit 0
